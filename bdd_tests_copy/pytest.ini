[pytest]
# Test discovery
testpaths = features/steps
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# BDD configuration
bdd_features_base_dir = features/

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# HTML Report Configuration
html_report = reports/test_report.html
self_contained_html = true

# Retry Configuration (using pytest-rerunfailures plugin)
reruns = 2
reruns_delay = 1

# Reporting
addopts = 
    -v
    --strict-markers
    --tb=short
    --capture=no
    --color=yes
    --durations=10
    --html=reports/test_report.html
    --self-contained-html
    --reruns 2
    --reruns-delay 1

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    smoke: marks tests as smoke tests
    regression: marks tests as regression tests
    bdd: marks tests as BDD tests
    api: marks tests as API tests
    negative: marks tests as negative test cases
    positive: marks tests as positive test cases
